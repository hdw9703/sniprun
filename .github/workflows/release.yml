name: Build and Release Sniprun

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.3). Required when running manually.'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/sniprun

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sniprun
          path: target/release/sniprun

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sniprun
          path: ./

      - name: Determine release tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [ -z "${{ github.event.inputs.tag }}" ]; then
              echo "No tag provided for manual dispatch, exiting."
              exit 1
            fi
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            # extract tag from refs/tags/<tag>
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sniprun
          generate_release_notes: true
          tag_name: ${{ env.TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
